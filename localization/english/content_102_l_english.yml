l_english:
 oscar_wilde_events.1.t:1 "Кожен вбиває те, що любить"
 oscar_wilde_events.1.wilde:2 "Сумнозвісний драматург-денді [SCOPE.sCharacter('oscar_wilde').GetFullName] був засуджений на два роки каторжних робіт за звинуваченням у гомосексуалізмі. Якщо [SCOPE.sCharacter('oscar_wilde').GetCustom('UA_vin_vona')|l] не отримує помилування, ми зможемо засудити мистецтво у [Concept('concept_country','$concept_country_loc$')|l] [ROOT.GetCountry.GetNameNoFlag] разом з [SCOPE.sCharacter('oscar_wilde').GetCustom('UA_nym_neju')|l]."
 oscar_wilde_events.1.flavor_wilde:1 "-[SCOPE.sCharacter('oscar_wilde').GetCustom('UA_joho_jiji')] творчість є найкращим зразком національної традиції сатири та дотепности.\n\n"
 oscar_wilde_events.1.flavor_author:0 "-У ньому є вся жахлива краса грецької трагедії, трагедії, в якій я брав велику участь.\n\n"
 oscar_wilde_events.1.flavor_quote:0 "-Книги, які світ називає аморальними, - це книги, що показують світові його власну ганьбу."
 oscar_wilde_tt:0 "[SCOPE.sCharacter('oscar_wilde').GetFullName] буде звільнено."
 oscar_wilde_events.1.a:0 "Геній заслуговує на виїмку."
 oscar_wilde_events.1.b:0 "Ми не повинні бути пристріченими, що зневажаємо вердикти наших суддів."
 oscar_wilde_events.1.c:0 "Це варварство, що вважається кримінальним злочином..."
